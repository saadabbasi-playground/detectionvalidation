---
# SIEM base extension — OpenSearch + Vector + Grafana telemetry stack.
# Extended per-SIEM via compose/siem/<name>.yml
# Use: ./dv up lab --siem opensearch
name: detection-validator

services:
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: dv-opensearch
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      discovery.type: ${OPENSEARCH_DISCOVERY:-single-node}
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:-Admin1234!}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - dv-net
    deploy:
      resources:
        limits:
          memory: ${OPENSEARCH_HEAP:-1g}

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.14.0
    container_name: dv-opensearch-dashboards
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - dv-net
    deploy:
      resources:
        limits:
          memory: 512m

  vector:
    extends:
      file: shippers/vector.yml
      service: vector

  grafana:
    image: grafana/grafana:11.0.0
    container_name: dv-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../configs/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../configs/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - opensearch
    networks:
      - dv-net
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  opensearch-data:
    driver: local
  grafana-data:
    driver: local
