---
# Microsoft Sentinel stub — ./dv up --siem sentinel
# Sentinel is a cloud-only service; this compose extension configures the
# Log Analytics workspace forwarder and validates API connectivity.
name: detection-validator

services:
  sentinel-forwarder:
    image: ${REGISTRY:-detection-validator}/core:${TAG:-dev}
    container_name: dv-sentinel-forwarder
    restart: unless-stopped
    command: ["siem", "connect", "--type", "sentinel"]
    environment:
      SENTINEL_WORKSPACE_ID: ${SENTINEL_WORKSPACE_ID:?SENTINEL_WORKSPACE_ID required}
      SENTINEL_PRIMARY_KEY: ${SENTINEL_PRIMARY_KEY:?SENTINEL_PRIMARY_KEY required}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
    networks:
      - dv-net
    healthcheck:
      test: ["CMD", "detection-validator", "siem", "status", "--type", "sentinel"]
      interval: 60s
      timeout: 20s
      retries: 3
