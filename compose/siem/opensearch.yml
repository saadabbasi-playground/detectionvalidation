---
# OpenSearch SIEM extension — included by ./dv up --siem opensearch
name: detection-validator

services:
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: dv-opensearch
    restart: unless-stopped
    environment:
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-DetectVal123!}
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      discovery.type: ${OPENSEARCH_DISCOVERY:-single-node}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -k https://localhost:9200/_cluster/health -u admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-DetectVal123!} || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    networks:
      - dv-net
    deploy:
      resources:
        limits:
          memory: ${OPENSEARCH_HEAP:-1g}

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.14.0
    container_name: dv-opensearch-dashboards
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_SSL_VERIFICATIONMODE: none
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-DetectVal123!}
    ports:
      - "${DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - dv-net
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  opensearch-data:
    driver: local
