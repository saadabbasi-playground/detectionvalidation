---
# OpenSearch SIEM extension — included by ./dv up --siem opensearch
name: detection-validator

services:
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: dv-opensearch
    restart: unless-stopped
    environment:
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-DetectVal123!}
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms768m -Xmx768m}
      discovery.type: ${OPENSEARCH_DISCOVERY:-single-node}
      plugins.security.disabled: "true"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - dv-net
    deploy:
      resources:
        limits:
          memory: ${OPENSEARCH_HEAP:-2g}

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.14.0
    container_name: dv-opensearch-dashboards
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
    volumes:
      - ./compose/siem/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    ports:
      - "${DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - dv-net
    deploy:
      resources:
        limits:
          memory: ${DASHBOARDS_MEMORY:-1g}

volumes:
  opensearch-data:
    driver: local
