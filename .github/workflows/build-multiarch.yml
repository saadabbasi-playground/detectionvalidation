name: Build & Push Multi-Arch Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (e.g. dev)"
        default: "dev"
        required: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-push:
    name: Build & push (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        target: [core, attacker, linux-victim, win-emulator, atomic-runner]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag || 'dev' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.target }}
        run: |
          TAG=${{ steps.tag.outputs.tag }} \
          REGISTRY=${{ env.REGISTRY }} \
          PUSH=true \
          docker buildx bake \
            --file docker-bake.hcl \
            --set "*.cache-from=type=gha" \
            --set "*.cache-to=type=gha,mode=max" \
            ${{ matrix.target }}

  # Windows image is built separately — only on hosted amd64 runner
  build-push-windows:
    name: Build & push (win-victim)
    runs-on: windows-2022
    needs: []
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push win-victim
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          docker buildx bake `
            --file docker-bake.hcl `
            --set "win-victim.output=type=registry" `
            win-victim
        env:
          REGISTRY: ${{ env.REGISTRY }}
          TAG: ${{ github.ref_name }}
          PUSH: "true"
