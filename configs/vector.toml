# Vector configuration — routes victim telemetry to active SIEM(s).
# This file is mounted into the vector container at /etc/vector/vector.toml.

[api]
enabled = true
address = "0.0.0.0:8686"

# ── Sources ──────────────────────────────────────────────────────────────────

[sources.victim_audit_logs]
type = "file"
include = ["/var/log/victim/**/*.log"]
read_from = "beginning"

[sources.docker_logs]
type = "docker_logs"
docker_host = "unix:///var/run/docker.sock"
include_containers = ["dv-linux-victim", "dv-win-emulator"]

# Synthetic syslog events for pipeline validation (active when victim containers are not running).
[sources.demo_logs]
type = "demo_logs"
format = "syslog"
interval = 5.0

# ── Transforms ───────────────────────────────────────────────────────────────

[transforms.parse_sysmon]
type = "remap"
inputs = ["victim_audit_logs", "docker_logs", "demo_logs"]
source = '''
  .source = "detection-validator"
  .host = get_env_var!("HOSTNAME")
  if is_string(.message) {
    parsed, err = parse_json(.message)
    if err == null { ., _ = merge(., parsed) }
  }
  # Parse ISO timestamp string to native type so Splunk HEC sink uses it correctly.
  if is_string(.timestamp) {
    ts, err = parse_timestamp(.timestamp, format: "%+")
    if err == null { .timestamp = ts }
  }
'''

# ── Sinks ────────────────────────────────────────────────────────────────────

[sinks.opensearch_out]
type = "elasticsearch"
inputs = ["parse_sysmon"]
endpoints = ["https://${OPENSEARCH_HOST:-opensearch}:${OPENSEARCH_PORT:-9200}"]
mode = "bulk"
suppress_type_name = true
api_version = "v8"

  [sinks.opensearch_out.auth]
  strategy = "basic"
  user = "${OPENSEARCH_USERNAME:-admin}"
  password = "${OPENSEARCH_PASSWORD:-DetectVal123!}"

  [sinks.opensearch_out.bulk]
  index = "dv-telemetry-%Y.%m.%d"

  [sinks.opensearch_out.tls]
  verify_certificate = false
  verify_hostname = false

  [sinks.opensearch_out.request]
  timeout_secs = 30

[sinks.splunk_hec]
type = "splunk_hec_logs"
inputs = ["parse_sysmon"]
endpoint = "${SPLUNK_HEC_URL:-http://splunk:8088}"
token = "${SPLUNK_HEC_TOKEN:-dv-hec-token}"
index = "detection_validator"

  [sinks.splunk_hec.encoding]
  codec = "json"

  [sinks.splunk_hec.acknowledgements]
  enabled = false

  [sinks.splunk_hec.healthcheck]
  enabled = false
