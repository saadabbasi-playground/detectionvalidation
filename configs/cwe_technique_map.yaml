# CWE → ATT&CK technique inference table
#
# When a CVE declares one of these CWEs and no direct CTID mapping exists,
# these techniques are inferred with the given confidence.
#
# Format per entry:
#   cwe_id    : CWE-NNN (string)
#   techniques: list of ATT&CK technique IDs
#   confidence: 0-1 base confidence score
#   note      : optional human-readable rationale

mappings:

  # ─── Injection ──────────────────────────────────────────────────────────────
  - cwe_id: CWE-77
    techniques: [T1059]
    confidence: 0.80
    note: Command injection — adversary can run arbitrary OS commands

  - cwe_id: CWE-78
    techniques: [T1059, T1059.003]
    confidence: 0.85
    note: OS Command Injection — direct shell command execution

  - cwe_id: CWE-89
    techniques: [T1190]
    confidence: 0.80
    note: SQL Injection — initial access / exploit public-facing application

  - cwe_id: CWE-94
    techniques: [T1059]
    confidence: 0.75
    note: Code injection

  - cwe_id: CWE-917
    techniques: [T1059]
    confidence: 0.85
    note: Expression language injection (e.g. Log4Shell, Spring4Shell)

