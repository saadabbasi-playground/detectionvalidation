  # ─── network_connection / DNS correlations ────────────────────────────────────
  - log_sources: [network_connection, dns, zeek:conn, zeek:dns]
    keywords: [beacon, beacon_score, dc(query)]
    techniques: [T1071.004, T1568.002]
    confidence: 0.75

  - log_sources: [network_connection]
    keywords: [bytes_out, exfil, bytes > ]
    techniques: [T1041]
    confidence: 0.65

  # ─── registry correlations ────────────────────────────────────────────────────
  - log_sources: [registry_event, registry_set]
    keywords: [Run, RunOnce, CurrentVersion\\Run]
    techniques: [T1547.001]
    confidence: 0.85

  - log_sources: [registry_event, registry_set]
    keywords: [HKLM\\SAM, HKLM\\Security]
    techniques: [T1003.002]
