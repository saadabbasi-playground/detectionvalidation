    techniques: [T1218.007]
    confidence: 0.75

  - log_sources: [process_creation]
    keywords: [ntdsutil]
    techniques: [T1003.003]
    confidence: 0.85

  - log_sources: [process_creation]
    keywords: [vssadmin]
    techniques: [T1003.003, T1490]
