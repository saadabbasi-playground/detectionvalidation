  # ─── security_event / windows correlations ───────────────────────────────────
  - log_sources: [security, windows_event_log]
    keywords: [EventCode=4625, EventID=4625, "4625"]
    techniques: [T1110]
    confidence: 0.75

  - log_sources: [security, windows_event_log]
    keywords: [EventCode=4688, EventID=4688, "4688"]
    techniques: [T1059]
    confidence: 0.50
    note: Process creation — needs further refinement from query content

  - log_sources: [security, windows_event_log]
    keywords: [EventCode=7045, EventID=7045, "7045", PSEXESVC, ServiceName]
    techniques: [T1021.002, T1543.003]
    confidence: 0.80

  - log_sources: [security, windows_event_log]
    keywords: [EventCode=4697, EventID=4697, "4697"]
    techniques: [T1543.003]
    confidence: 0.75

  # ─── cloud / Azure correlations ──────────────────────────────────────────────
  - log_sources: [AuditLogs, azure_audit]
