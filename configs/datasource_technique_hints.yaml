# Data-source / log-source correlation table
#
# Each entry fires when the detection's logsource matches AND the query
# contains at least one keyword from the keywords list.
#
# Fields:
#   log_sources : list of Sigma-style category/product/service values to match
#                 (OR logic — any match fires the entry)
#   keywords    : list of strings that must appear in the raw query (OR logic)
#   techniques  : list of inferred technique IDs
#   confidence  : base confidence 0-1
#   note        : optional rationale

hints:

  # ─── process_creation correlations ─────────────────────────────────────────
  - log_sources: [process_creation]
    keywords: [certutil, certutil.exe]
    techniques: [T1140, T1105]
    confidence: 0.75

  - log_sources: [process_creation]
    keywords: [mshta, mshta.exe]
    techniques: [T1218.005]
    confidence: 0.85

  - log_sources: [process_creation]
    keywords: [regsvr32]
    techniques: [T1218.010]
    confidence: 0.80

  - log_sources: [process_creation]
    keywords: [rundll32]
    techniques: [T1218.011]
    confidence: 0.80

  - log_sources: [process_creation]
    keywords: [wmic, wmic.exe]
    techniques: [T1047]
    confidence: 0.80

  - log_sources: [process_creation]
    keywords: [powershell, pwsh]
    techniques: [T1059.001]
    confidence: 0.65
    note: Generic powershell — refine via keyword hits for encoded/IEX patterns

  - log_sources: [process_creation]
    keywords: [cmd.exe, cmd /c]
    techniques: [T1059.003]
    confidence: 0.65

  - log_sources: [process_creation]
    keywords: [wscript, cscript]
    techniques: [T1059.005]
