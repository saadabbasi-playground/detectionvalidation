  # ─── process_access correlations ────────────────────────────────────────────
  - log_sources: [process_access]
    keywords: [lsass.exe]
    techniques: [T1003.001]
    confidence: 0.85

  - log_sources: [process_access]
    keywords: [GrantedAccess, OpenProcess]
    techniques: [T1003.001, T1055]
