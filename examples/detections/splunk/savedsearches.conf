[Suspicious PowerShell Encoded Command]
search = index=wineventlog EventCode=4688 (CommandLine="*-enc*" OR CommandLine="*-EncodedCommand*") | stats count by host, user, CommandLine | where count > 0
description = Detects PowerShell using encoded commands which is a common obfuscation technique. Mapped to T1059.001.
alert.severity = 4
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now

[Lateral Movement via PsExec]
search = index=wineventlog (EventCode=7045 OR EventCode=4697) ServiceName="PSEXESVC" | eval technique="T1570" | table _time, host, user, ServiceName, technique
description = Detects PsExec service installation for lateral movement (T1570 lateral tool transfer).
alert.severity = 4
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
