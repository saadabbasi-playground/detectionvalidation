title: MSHTA Spawning Windows Shell
id: a32e3a56-4dc6-4c85-a32d-6d50d4f7f5c3
status: stable
description: Detects MSHTA.exe spawning a Windows shell such as cmd.exe or PowerShell.
author: Detection Team
date: 2023/01/15
modified: 2024/03/01
tags:
    - attack.execution
    - attack.defense-evasion
    - attack.T1218.005
    - attack.T1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: '\mshta.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\wscript.exe'
            - '\cscript.exe'
    condition: selection
falsepositives:
    - None known
level: high
