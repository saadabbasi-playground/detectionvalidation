title: LSASS Memory Dump via Task Manager
id: b3c5e9a1-72f4-4c9e-b8d3-125e4f6a7c8d
status: stable
description: |
  Detects LSASS memory dump creation via Task Manager or other tools that use
  the MiniDumpWriteDump API. Commonly used during credential access attacks.
author: Security Operations
date: 2022/11/10
modified: 2024/01/20
tags:
    - attack.credential-access
    - attack.T1003.001
    - cve.2021.36942
logsource:
    category: process_access
    product: windows
detection:
    selection_target:
        TargetImage|endswith: '\lsass.exe'
    selection_type:
        GrantedAccess|contains:
            - '0x1FFFFF'
            - '0x1010'
            - '0x143A'
    filter_defender:
        SourceImage|startswith:
            - 'C:\ProgramData\Microsoft\Windows Defender'
    condition: selection_target and selection_type and not filter_defender
falsepositives:
    - AV solutions performing process inspection
    - Legitimate debugging activities
level: critical
