title: PrintNightmare Spooler Service Exploitation
id: c8b2f045-3a71-4d9e-b836-5f1c2d8e9a07
status: stable
description: |
  Detects PrintNightmare (CVE-2021-34527) exploitation attempts where the Windows
  Print Spooler service (spoolsv.exe) spawns unexpected child processes or loads
  a DLL from a remote UNC path. Successful exploitation grants SYSTEM privileges
  (local) or allows unauthenticated RCE via the RpcAddPrinterDriverEx() call
  (remote). Both privilege escalation and lateral movement paths are covered.
author: Security Operations
date: 2024/01/15
modified: 2024/06/01
tags:
    - attack.privilege-escalation
    - attack.T1068
    - attack.persistence
    - attack.T1547.012
    - attack.defense-evasion
    - attack.T1574.001
    - cve.2021.34527
logsource:
    category: process_creation
    product: windows
detection:
    selection_spooler_child:
        ParentImage|endswith: '\spoolsv.exe'
    filter_known_good:
        Image|endswith:
            - '\splwow64.exe'
            - '\printfilterpipelinesvc.exe'
            - '\PrintIsolationHost.exe'
            - '\conhost.exe'
    selection_unc_dll:
        Image|endswith: '\rundll32.exe'
        CommandLine|re: '\\\\[^\\]+\\[^\\]+\\.dll'
    condition: (selection_spooler_child and not filter_known_good) or selection_unc_dll
falsepositives:
    - Legitimate third-party printer driver installations from a network share
    - Enterprise software that invokes rundll32 against UNC-hosted libraries
level: high
