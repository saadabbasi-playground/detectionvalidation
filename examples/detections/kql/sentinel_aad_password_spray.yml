id: 1234abcd-5678-ef90-ab12-34567890cdef
name: Azure AD Password Spray Attack
description: |
  Detects password spray attacks against Azure Active Directory by identifying
  multiple failed login attempts to different accounts from the same IP address.
  Maps to T1110.003 (Brute Force: Password Spraying).
severity: High
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110.003
query: |
  SigninLogs
  | where TimeGenerated > ago(1h)
  | where ResultType != 0
  | summarize
      FailureCount = count(),
      DistinctAccounts = dcount(UserPrincipalName),
      FailureReasons = make_set(ResultDescription)
    by IPAddress, AppDisplayName
  | where FailureCount > 50 and DistinctAccounts > 10
  | project IPAddress, FailureCount, DistinctAccounts, FailureReasons, AppDisplayName
version: 1.2.0
author: Azure Sentinel Team
