# Route sysmon events to a dedicated file, stripping the syslog envelope.
# The %msg% template preserves only the event payload (JSON or key=value string)
# so the entrypoint parser does not have to strip timestamps and hostnames.

$template SysmonEventsTemplate,"%msg%\n"

:programname, isequal, "sysmon" /var/log/sysmon.log;SysmonEventsTemplate
& stop
