# Local-dev single-node OpenSearch stack
# Security and TLS are DISABLED — for local development only.
# Requires Docker Desktop with ~2 GB RAM available.
#
# Usage (via CLI):
#   dv siem up        # start
#   dv siem down      # stop  (data volume preserved)
#   dv siem down --volumes   # stop + delete data
#   dv siem status    # check
#
# Direct usage:
#   docker compose -f docker/opensearch/docker-compose.yml up -d
#
# Endpoints once running:
#   OpenSearch API   http://localhost:9200
#   Dashboards UI    http://localhost:5601

services:
  opensearch:
    image: opensearchproject/opensearch:2.19.5
    container_name: dv-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.5
    container_name: dv-opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
    name: dv-opensearch-data
